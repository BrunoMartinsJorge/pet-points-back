spring.application.name=pet-points-back

api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=50000
spring.mail.properties.mail.smtp.writetimeout=5000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

server.port=${PORT:8080}

logging.level.org.hibernate.SQL=WARN

mercadopago.base-url=${URL_BASE_MERCADO_PAGO}
mercado-pago.public-key=${PUBLIC_KEY_MERCADO_PAGO}
mercado-pago.access-token=${ACCESS_TOKEN_MERCADO_PAGO}

springdoc.swagger-ui.path=/api-docs-ui.html

springdoc.api-docs.path=/api-docs

springdoc.swagger-ui.operationsSorter=alpha